
[project]
name = "subcompose"
description = "A command line utility to manage subsets of services in compose.yaml files."
authors = [
    {name = "José Hernández", email = "jh3875@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
version = "1.0.0"
dependencies = [
    "docopt-ng>=0.9.0,<1.0.0",
    "PyYAML>=6.0.3,<7.0"
]

[project.scripts]
subcompose = "subcompose.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subcompose"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pygments>=2.20.0,<3",
    "types-pyyaml>=6.0.12.20250915,<7",
    "mypy>=1.19.1,<2",
    "ruff>=0.14.10,<0.15",
    "pip>=26.1,<27",
    "pytest-cov>=7.0.0,<8",
]
docs = [
    "sphinx>=8.0,<9",
    "sphinx-rtd-theme>=3.0,<4.0",
    "sphinx-autodoc-typehints>=3.0,<4",
    "pygments>=2.20.0,<3",
    "requests>=2.33.1,<3",
]
sast = [
    "bandit>=1.9,<2",
]
sbom = [
    "cyclonedx-bom>=7.3.0,<8",
    "lxml>=6.1.0,<7",
]
sbom-audit = [
    "pip-audit>=2.10,<3",
    "requests>=2.33.1,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Python 3.14: importlib.metadata.version() uses [] on its own Message object
    # internally, which triggers its own DeprecationWarning (CPython issue).
    "ignore::DeprecationWarning:importlib.metadata",
]

[tool.mypy]
mypy_path = "src"
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]

[tool.ruff.lint]
# D203 (one-blank-line-before-class) conflicts with D211 (no-blank-line-before-class)
# D213 (multi-line-summary-second-line) conflicts with D212 (multi-line-summary-first-line)
ignore = ["D203", "D213"]
