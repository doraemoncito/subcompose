name: Build distributions
description: Install dependencies and build wheel + sdist

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v8

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: "uv"

    - name: Install dependencies
      run: uv sync --frozen
      shell: bash

    - name: Build package
      run: make package
      shell: bash
